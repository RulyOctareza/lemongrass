appId: com.lemongrass.app
productName: Lemongrass
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!.snapshot/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Fails the package when app.asar holds an npm package that out/licenses.json does not credit.
afterPack: ./scripts/afterPack.mjs
asarUnpack:
  - resources/**
win:
  executableName: lemongrass
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Ad-hoc signature until there is a Developer ID: with no identity electron-builder skips signing, and macOS calls
  # the unsigned arm64 app damaged. The hardened runtime stays off with it, since its library validation rejects the
  # ad-hoc signed Electron framework at launch; it only matters for notarization, which needs the Developer ID anyway.
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  # A map, not a list: electron-builder merges this object into Info.plist key by key, and a list would land as keys
  # "0", "1" and "length".
  extendInfo:
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  extraResources:
    - from: "../dist/darwin-amd64/lgrass"
      to: "bin/darwin-amd64/lgrass"
    - from: "../dist/darwin-amd64/lgrassd"
      to: "bin/darwin-amd64/lgrassd"
    - from: "../dist/darwin-arm64/lgrass"
      to: "bin/darwin-arm64/lgrass"
    - from: "../dist/darwin-arm64/lgrassd"
      to: "bin/darwin-arm64/lgrassd"
    - from: "../dist/darwin-amd64/lgrassconf"
      to: "bin/darwin-amd64/lgrassconf"
    - from: "../dist/darwin-arm64/lgrassconf"
      to: "bin/darwin-arm64/lgrassconf"
dmg:
  # The release builds one dmg per arch into the same directory, so the arch keeps them from overwriting each other.
  # The in-app updater looks the dmg up by this name (dmgAssetName in ui/src/main/updateVersion.ts).
  artifactName: ${name}-${version}-${arch}.${ext}
  # The app is not notarized, so Gatekeeper blocks its first launch from a downloaded dmg. The background prints the
  # steps to open it anyway, and the text file under them repeats the steps with the command to copy and points at
  # scripts/install-mac.sh. dmg-builder sizes the window from the background (540x500), so there is no window block.
  # The positions match build/dmg/background.html, which renders both pngs. Setting contents replaces the default
  # layout, so the app and the Applications link are listed here too.
  background: build/dmg/background.png
  contents:
    - x: 130
      y: 130
      type: file
    - x: 410
      y: 130
      type: link
      path: /Applications
    - x: 270
      y: 425
      type: file
      path: "build/dmg/If Lemongrass won't open.txt"
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: Faizal Alviansyah <faizal.alviansyah@gmail.com>
  category: Utility
  extraResources:
    # Both arches bundled unconditionally rather than relying on
    # electron-builder's ${arch} path templating across AppImage/deb/snap
    # -- the main process picks the right one at install time via
    # process.arch.
    - from: "../dist/linux-amd64/lgrass"
      to: "bin/linux-amd64/lgrass"
    - from: "../dist/linux-amd64/lgrassd"
      to: "bin/linux-amd64/lgrassd"
    - from: "../dist/linux-arm64/lgrass"
      to: "bin/linux-arm64/lgrass"
    - from: "../dist/linux-arm64/lgrassd"
      to: "bin/linux-arm64/lgrassd"
    - from: "../dist/linux-amd64/lgrassconf"
      to: "bin/linux-amd64/lgrassconf"
    - from: "../dist/linux-arm64/lgrassconf"
      to: "bin/linux-arm64/lgrassconf"
    # The root helper. Its path is named by the polkit action in build/polkit, so it moves only together with that file.
    - from: "../dist/linux-amd64/lgrassroot"
      to: "bin/linux-amd64/lgrassroot"
    - from: "../dist/linux-arm64/lgrassroot"
      to: "bin/linux-arm64/lgrassroot"
# git backs the biblio history in lgrassd. Passed to fpm rather than set as depends, which would replace
# electron-builder's default dependency list instead of adding to it.
deb:
  afterInstall: build/deb-after-install.sh
  afterRemove: build/deb-after-remove.sh
  fpm: ['--depends', 'git']
# No custom scriptlets: setting afterInstall or afterRemove replaces electron-builder's defaults, which create
# /usr/bin/lemongrass and set the chrome-sandbox mode. The keeper unit is per-user, written by `lgrassconf install`.
# The in-app updater finds the release asset by this fixed name.
# The polkit action and rule go in as fpm src=dst inputs, the way electron-builder ships the icon and .desktop file,
# so they need no scriptlet: polkitd picks them up by itself. Sources are relative to ui/, where fpm runs. polkit
# provides pkexec, which the app runs the helper through.
rpm:
  artifactName: ${name}-${version}.x86_64.${ext}
  fpm:
    - '--depends'
    - 'git'
    - '--depends'
    - 'polkit'
    - 'build/polkit/com.lemongrass.app.lgrassroot.policy=/usr/share/polkit-1/actions/com.lemongrass.app.lgrassroot.policy'
    - 'build/polkit/com.lemongrass.app.lgrassroot.rules=/usr/share/polkit-1/rules.d/com.lemongrass.app.lgrassroot.rules'
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
