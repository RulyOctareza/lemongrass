appId: com.lemongrass.app
productName: Lemongrass
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!.snapshot/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: lemongrass
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  extraResources:
    - from: "../dist/darwin-amd64/lgrass"
      to: "bin/darwin-amd64/lgrass"
    - from: "../dist/darwin-amd64/lgrassd"
      to: "bin/darwin-amd64/lgrassd"
    - from: "../dist/darwin-arm64/lgrass"
      to: "bin/darwin-arm64/lgrass"
    - from: "../dist/darwin-arm64/lgrassd"
      to: "bin/darwin-arm64/lgrassd"
    - from: "../dist/darwin-amd64/lgrassconf"
      to: "bin/darwin-amd64/lgrassconf"
    - from: "../dist/darwin-arm64/lgrassconf"
      to: "bin/darwin-arm64/lgrassconf"
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: Faizal Alviansyah <faizal.alviansyah@gmail.com>
  category: Utility
  extraResources:
    # Both arches bundled unconditionally rather than relying on
    # electron-builder's ${arch} path templating across AppImage/deb/snap
    # -- the main process picks the right one at install time via
    # process.arch.
    - from: "../dist/linux-amd64/lgrass"
      to: "bin/linux-amd64/lgrass"
    - from: "../dist/linux-amd64/lgrassd"
      to: "bin/linux-amd64/lgrassd"
    - from: "../dist/linux-arm64/lgrass"
      to: "bin/linux-arm64/lgrass"
    - from: "../dist/linux-arm64/lgrassd"
      to: "bin/linux-arm64/lgrassd"
    - from: "../dist/linux-amd64/lgrassconf"
      to: "bin/linux-amd64/lgrassconf"
    - from: "../dist/linux-arm64/lgrassconf"
      to: "bin/linux-arm64/lgrassconf"
# git backs the biblio history in lgrassd. Passed to fpm rather than set as depends, which would replace
# electron-builder's default dependency list instead of adding to it.
deb:
  afterInstall: build/deb-after-install.sh
  afterRemove: build/deb-after-remove.sh
  fpm: ['--depends', 'git']
# No custom scriptlets: setting afterInstall or afterRemove replaces electron-builder's defaults, which create
# /usr/bin/lemongrass and set the chrome-sandbox mode. The keeper unit is per-user, written by `lgrassconf install`.
# The in-app updater finds the release asset by this fixed name.
rpm:
  artifactName: ${name}-${version}.x86_64.${ext}
  fpm: ['--depends', 'git']
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
